name: Feature request
description: Suggest a focused improvement for Mint Woodland Pet
title: "[Feature]: "
labels: []
body:
  - type: textarea
    id: need
    attributes:
      label: What need would this address?
      description: Describe the user problem before proposing the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work from the user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: This proposal does not require collecting typed text or application content.
          required: true
        - label: I searched existing issues for similar requests.
          required: true
